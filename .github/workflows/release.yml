name: Release

# on:
#    push:
#      tags:
#        - 'v*'

on:  # Tmp for debug
  pull_request:
    branches:
      - master
    paths-ignore:
      - "README.md"

jobs:
  pypi:
    name: Release To PyPi
    runs-on: ubuntu-22.04
    steps:
        - name: Checkout 
          uses: actions/checkout@v2
        - name: Install boost static library with fpic
          run: |
            wget -q https://boostorg.jfrog.io/artifactory/main/release/1.71.0/source/boost_1_71_0.tar.gz
            tar xf boost_1_71_0.tar.gz && cd boost_1_71_0 && ./bootstrap.sh
            sudo ./boost_1_71_0/b2  --with-filesystem --with-serialization --with-program_options --with-system cxxflags=-fPIC cflags=-fPIC link=static -a install
